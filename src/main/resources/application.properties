spring.application.name=minimart-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/minimart_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
